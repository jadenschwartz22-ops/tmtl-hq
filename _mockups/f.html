<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="color-scheme" content="dark"/>
<title>F · Atrium — all pages</title>
<style>
:root{--bg:oklch(4.5% .004 260);--fg:oklch(94% .005 90);--muted:oklch(54% .008 260);--faint:oklch(34% .007 260);--line:oklch(19% .006 260)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,sans-serif;padding:26px}
h1{font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--faint);font-weight:500;margin:0 0 5px}
p.sub{color:var(--muted);margin:0 0 26px;font-size:13px;max-width:74ch}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
figure{margin:0}
.frame{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#000;aspect-ratio:16/11}
iframe{width:200%;height:200%;border:0;transform:scale(.5);transform-origin:0 0}
figcaption{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:10px;font-size:12.5px}
figcaption b{font-weight:600}
figcaption span{color:var(--faint);font-size:11.5px}
a.open{color:var(--muted);font-size:10px;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:2px;white-space:nowrap}
a.open:hover{color:var(--fg)}
</style>
</head>
<body>
<h1>F · Atrium — the whole site</h1>
<p class="sub">Homepage unchanged from the version you picked. The four inner pages now share its ground, type, wash and timing. Open them full-size and click through the nav; the pages are wired to each other.</p>
<div class="grid">
  <figure><div class="frame"><iframe src="f-atrium.html" title="Home"></iframe></div>
    <figcaption><b>Home</b><span>As approved</span><a class="open" href="f-atrium.html">Open</a></figcaption></figure>
  <figure><div class="frame"><iframe src="f-about.html" title="About"></iframe></div>
    <figcaption><b>About</b><span>Ruled rows, one plate</span><a class="open" href="f-about.html">Open</a></figcaption></figure>
  <figure><div class="frame"><iframe src="f-projects.html" title="Projects"></iframe></div>
    <figcaption><b>Projects</b><span>Catalogue rows</span><a class="open" href="f-projects.html">Open</a></figcaption></figure>
  <figure><div class="frame"><iframe src="f-contact.html" title="Contact"></iframe></div>
    <figcaption><b>Contact</b><span>Ruled fields, no card</span><a class="open" href="f-contact.html">Open</a></figcaption></figure>
  <figure><div class="frame"><iframe src="f-privacy.html" title="Privacy"></iframe></div>
    <figcaption><b>Privacy</b><span>Sectioned prose</span><a class="open" href="f-privacy.html">Open</a></figcaption></figure>
  <figure><div class="frame"><iframe src="f-terms.html" title="Terms"></iframe></div>
    <figcaption><b>Terms</b><span>Sectioned prose</span><a class="open" href="f-terms.html">Open</a></figcaption></figure>
</div>
</body>
</html>
