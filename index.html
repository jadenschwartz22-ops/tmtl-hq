<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Teach Me to Live — Tools for Learning</title>
  <meta name="description" content="Intentional, minimalist software for learning. Minimal noise, maximal signal." />
  <link rel="canonical" href="https://teachmetolive.com/" />
  <link rel="icon" href="/favicon.ico" sizes="any">
  <meta name="theme-color" content="#000000" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;1,300&family=Archivo:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/pages.css" />
  <style>
    /* Homepage only: the quote is centered and is the whole page.
       Inner pages are left-aligned; that difference is intentional. */
    main.reading{flex:1; display:flex; flex-direction:column; justify-content:center; padding:clamp(28px,7vh,80px) 0}
    /* The mark is fully opaque with a soft halo added OUTSIDE the silhouette
       (blur the alpha, keep only what falls beyond the shape, composite it
       under the original). The edges fade into the ground without costing the
       artwork any weight.
       An earlier pass eroded INWARD from the contour instead, which fades a
       fixed band in from every edge -- so thin features (sun rays, horn tip,
       legs) sit entirely inside that band and never reach full opacity. That
       is what read as blurry: the mark was weakest exactly where it had to be
       crisp. Do not reintroduce it.
       Baked into the PNG because Safari ignores mask-image on <img>.
       Cache-bust with ?v=<hash> on redeploy: a brand-new asset FILENAME can
       404 on Pages for a while after the build reports success, which briefly
       broke the live page; the stable name plus a query string avoids both
       that and the stale-bytes problem. */
    .emblem{
      width:236px; height:auto; display:block;
      margin:0 auto clamp(40px,6.5vh,60px); opacity:.95;
    }
    .quote-wrap{max-width:var(--qw,43ch); margin:0 auto; text-align:center}
    /* --qs is set per quote from its character count (see sizeFor), so the
       emblem above keeps a fixed size and the text absorbs the variation.
       The old .long class was a single 230-char cliff, which left mid-length
       quotes overflowing at full display size. */
    blockquote{
      margin:0; text-wrap:balance;
      font:300 italic var(--qs,2.75rem)/var(--ql,1.32) var(--serif);
      letter-spacing:var(--qt,-.013em);
    }
    blockquote::before{content:"\201C"; position:absolute; margin-left:-.56em; color:var(--faint); line-height:inherit}
    @media (max-width:640px){blockquote::before{display:none}}
    .w{display:inline-block; white-space:pre; opacity:0; will-change:opacity}
    .w.in{opacity:1; transition:opacity .95s cubic-bezier(.4,0,.2,1)}
    .w.out{opacity:0; transition:opacity .5s ease-in}
    .attr{
      margin-top:clamp(28px,4.8vh,40px); opacity:0;
      font:500 10px/1 var(--sans); letter-spacing:.24em; text-transform:uppercase; color:var(--muted);
      transition:opacity .8s ease;
    }
    .attr.in{opacity:1}
    .attr em{font-style:normal; color:var(--faint)}
    .attr::before{content:""; display:block; width:26px; height:1px; margin:0 auto 16px; background:var(--line)}
    @media (prefers-reduced-motion:reduce){
      .w{opacity:1!important; transition:none!important}
      .attr{opacity:1!important}
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap header-inner">
      <a class="brand" href="index.html" aria-label="Teach Me to Live — home">Teach Me to Live</a>
      <nav>
        <a href="about.html">About</a>
        <a href="projects.html">Projects</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="reading wrap">
    <img class="emblem" src="assets/logo-mark-feathered-512.png?v=a86fb1f2" alt="" width="512" height="507" />
    <div class="quote-wrap" aria-live="polite">
      <blockquote id="qtext"></blockquote>
      <div class="attr" id="qattr">Socrates</div>
    </div>
  </main>

  <div class="wrap">
    <div class="footline">
      <span><b>Tools for learning.</b> Makers of <a href="https://protoquiz.com">ProtoQuiz&trade;</a>.</span>
      <small>&copy; <span class="y"></span> Teach Me To Live LLC &middot; <a href="privacy.html">Privacy</a> &middot; <a href="terms.html">Terms</a></small>
    </div>
  </div>

  <script>
    document.querySelectorAll('.y').forEach(el => el.textContent = new Date().getFullYear());

    // Only the first quote is fixed; all others are randomized.
    const first = { text: "“The unexamined life is not worth living.”", attr: "— Socrates", author: "Socrates" };

    const poolRaw = [
      { text: "“Though free to think and act, we are held together like stars in the firmament with ties inseparable. These ties cannot be seen, but we can feel them. We are all one.”", attr: "— Nikola Tesla", author: "Nikola Tesla" },
      { text: "“Never was an age more sentimental, more devoid of real feeling, more exaggerated in false feeling, than our own.”", attr: "— D. H. Lawrence", author: "D. H. Lawrence" },
      { text: "“There is no tomorrow.”", attr: "— <em>Rocky III</em>", author: "Rocky III" },
      { text: "“Pause, you who read this, and think for a moment of the long chain of iron or gold, of thorns or flowers, that would never have bound you, but for the formation of the first link on one memorable day.”", attr: "— Charles Dickens, <em>Great Expectations</em>", author: "Charles Dickens" },
      { text: "“Forever is composed of nows.”", attr: "— Emily Dickinson", author: "Emily Dickinson" },
      { text: "“I dwell in Possibility.”", attr: "— Emily Dickinson", author: "Emily Dickinson" },
      { text: "“And so the ordinary demanded unblinking attention. Any tedious hour might be the last of its kind.”", attr: "— Marilynne Robinson, <em>Housekeeping</em>", author: "Marilynne Robinson" },
      { text: "“If your mouth is open, you're not learning.”", attr: "— Gautama Buddha", author: "Gautama Buddha" },
      { text: "“One extends one's limits only by exceeding them.”", attr: "— M. Scott Peck", author: "M. Scott Peck" },
      { text: "“Until you value yourself, you won't value your time. Until you value your time, you will not do anything with it.”", attr: "— M. Scott Peck", author: "M. Scott Peck" },
      { text: "“We have two lives, and the second begins when we realize we only have one.”", attr: "— Confucius", author: "Confucius" },
      { text: "“A man never discloses his own character so clearly as when he describes another's.”", attr: "— Jean Paul Richter", author: "Jean Paul Richter" },
      { text: "“Where to, Miss?” “To the stars.”", attr: "— <em>Titanic</em>", author: "Titanic" },
      { text: "“In Pittsburgh, in 1966, twenty-four Black men from the Hill answered a call for help and in the process changed the world. They were sons and fathers, bookbinders, mechanics, orderlies. They were paramedics, and they came from Freedom House… They did something truly remarkable, and their story goes something like this.”", attr: "— Kevin Hazzard, <em>American Sirens</em>", author: "Kevin Hazzard" },
      { text: "“Who knows what you might learn from taking a chance on conversation with a stranger? Everyone carries a piece of the puzzle. Nobody comes into your life by mere coincidence. Trust your instincts. Do the unexpected. Find the others…”", attr: "— Timothy Leary", author: "Timothy Leary" },
      { text: "“In other words, self-actualization is possible only as a side-effect of self-transcendence.”", attr: "— Viktor E. Frankl, <em>Man’s Search for Meaning</em>", author: "Viktor E. Frankl" },
      { text: "“We live together, we act on and react to one another; but always, and in all circumstances, we are by ourselves… From family to nation every human group is a society of island universes.”", attr: "— Aldous Huxley, <em>The Doors of Perception</em>", author: "Aldous Huxley" },
      { text: "“Was I a little full of myself at nineteen? Sure I was. I think you have to be to do anything important.”", attr: "— Michael Dell", author: "Michael Dell" },
      { text: "“Many people don’t reach their greatest potential because they fear failure. In avoiding failure, they deprive themselves of a great teacher.”", attr: "— Michael Dell", author: "Michael Dell" },
      { text: "“If you would persuade, appeal to interest and not to reason.”", attr: "— Benjamin Franklin, <em>Poor Richard’s Almanack</em> (via Charlie Munger)", author: "Benjamin Franklin" },

      { text: "“Who knows where madness lies? Perhaps to be too practical is madness. To surrender dreams—this may be madness. Too much sanity may be madness—and maddest of all: to see life as it is, and not as it should be!”", attr: "— Miguel de Cervantes, <em>Don Quixote</em>", author: "Miguel de Cervantes" },
      { text: "“Paths are made by walking.”", attr: "— Franz Kafka", author: "Franz Kafka" },
      { text: "“What lay beyond the shadows of the yard was an endless view of the world that you wouldn’t be able to see till dawn.”", attr: "— Jack Kerouac, <em>On the Road</em>", author: "Jack Kerouac" },
      { text: "“What a stupendous, what an incomprehensible machine is man! Who can endure toil, famine, stripes, imprisonment & death itself in vindication of his own liberty, and the next moment… inflict on his fellow men a bondage, one hour of which is fraught with more misery than ages of that which he rose in rebellion to oppose.”", attr: "— Thomas Jefferson", author: "Thomas Jefferson" },
      { text: "“We live as we dream—alone.”", attr: "— Joseph Conrad, <em>Heart of Darkness</em>", author: "Joseph Conrad" },
      { text: "“Every sorrow suggests a thousand songs, and every song calls a thousand sorrows; and so they are infinite in number, and all the same.”", attr: "— Marilynne Robinson, <em>Housekeeping</em>", author: "Marilynne Robinson" },
      { text: "“I give you the mausoleum of all hope and desire… I give it to you not that you may remember time, but that you might forget it now and then for a moment and not spend all of your breath trying to conquer it. Because no battle is ever won, he said. They are not even fought. The field only reveals to man his own folly and despair, and victory is an illusion of philosophers and fools.”", attr: "— William Faulkner, <em>The Sound and the Fury</em>", author: "William Faulkner" },
      { text: "“If you don’t become bitter, nothing can stop you from success.”", attr: "— Ralph Ellison, <em>Invisible Man</em> (Dr. Bledsoe)", author: "Ralph Ellison" },

      { text: "“It is not that we have a short time to live, but that we waste a lot of it. Life is long enough, and a sufficiently generous amount has been given to us for the highest achievements if it were all well invested. But when it is wasted in heedless luxury and spent on no good activity, we are forced at last by death’s final constraint to realize that it has passed away before we knew it was passing. So it is: we are not given a short life but we make it short, and we are not ill-supplied but wasteful of it… Life is long if you know how to use it.”", attr: "— Seneca, <em>On the Shortness of Life</em>", author: "Seneca" },

      { text: "“I will tell his majesty what a king is. A king does not abide within his tent while his men bleed and die upon the field. A king does not dine while his men go hungry, nor sleep when they stand at watch upon the wall. A king does not command his men’s loyalty through fear nor purchase it with gold; he earns their love by the sweat of his own back and the pains he endures for their sake. That which comprises the harshest burden, a king lifts first and sets down last. A king does not require service of those he leads but provides it to them. He serves them, not they him.”", attr: "— Steven Pressfield, <em>Gates of Fire</em> (Xeones)", author: "Steven Pressfield" },
      { text: "“I focus on the little things. The little things add up to big things.”", attr: "— Michael Jordan", author: "Michael Jordan" },
      { text: "“You have to learn how to perform without motivation. Just get the fuck back to work.”", attr: "— David Goggins", author: "David Goggins" },
      { text: "“But how could you live and have no story to tell?”", attr: "— Fyodor Dostoevsky, <em>White Nights</em>", author: "Fyodor Dostoevsky" },
      { text: "“The mystery of human existence lies not in just staying alive, but in finding something to live for.”", attr: "— Fyodor Dostoevsky, <em>The Brothers Karamazov</em>", author: "Fyodor Dostoevsky" },
      { text: "“If there is meaning in life at all, then there must be meaning in suffering.”", attr: "— Viktor E. Frankl", author: "Viktor E. Frankl" },
      { text: "“But there was no need to be ashamed of tears, for tears bore witness that a man had the greatest of courage, the courage to suffer.”", attr: "— Viktor E. Frankl, <em>Man’s Search for Meaning</em>", author: "Viktor E. Frankl" },
      { text: "“There is no reality except in action. Man is nothing else than his plan; he exists only to the extent that he fulfills himself; he is therefore nothing else than the ensemble of his acts, nothing else than his life.”", attr: "— Jean-Paul Sartre, <em>Existentialism is a Humanism</em>", author: "Jean-Paul Sartre" }
    ];

    const textSeen = new Set();
    function dedupe(list){
      const out = [];
      for (const q of list) if (!textSeen.has(q.text)) { textSeen.add(q.text); out.push(q); }
      return out;
    }
    function shuffle(arr){
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }
    function plainLen(html){
      const el = document.createElement('div'); el.innerHTML = html;
      return (el.textContent || "").trim().length;
    }

    // Quote length across the pool spans 23..577 chars, so a single breakpoint
    // left mid-length quotes overflowing. Size instead rides a continuous curve
    // on character count: the emblem stays put and the text yields to it.
    // Values are rem; the measure widens as the type shrinks so a long quote
    // doesn't turn into a narrow tower.
    function applySize(n){
      const t = Math.min(1, Math.max(0, (n - 70) / (430 - 70)));
      const e = Math.pow(t, 0.8);                  // ease so short quotes stay big
      const size = 2.72 + (1.18 - 2.72) * e;       // rem, floor lifted off tiny
      const lh   = 1.32 + (1.6 - 1.32) * e;
      const ls   = -0.013 + (-0.001 + 0.013) * e;  // em
      // Short quotes get a wider measure too, so a 3-word line does not wrap
      // mid-phrase; long ones widen again to avoid a narrow tower.
      const meas = (n < 70) ? 52 : 43 + (62 - 43) * e;   // ch
      const st = qt.style;
      st.setProperty('--qs', size.toFixed(3) + 'rem');
      st.setProperty('--ql', lh.toFixed(3));
      st.setProperty('--qt', ls.toFixed(4) + 'em');
      qw.style.setProperty('--qw', meas.toFixed(1) + 'ch');
    }
    // Longer passages get more time on screen, capped so it never drags.
    function durationFor(q){
      const extra = Math.max(0, (plainLen(q.text) - 140) / 26);
      return Math.min(10.5 + extra, 26);
    }

    const pool = shuffle(dedupe(poolRaw));
    const sequence = [first, ...pool];

    const qt = document.getElementById('qtext');
    const qa = document.getElementById('qattr');
    const qw = document.querySelector('.quote-wrap');
    const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
    let idx = 0, timer = null;

    // Each word is its own span so the passage can fade in by phrase.
    // Only opacity animates, so this never touches layout.
    function build(html){
      qt.innerHTML = '';
      const tmp = document.createElement('div');
      tmp.innerHTML = html;
      // Walk nodes so <em> inside a quote keeps its markup.
      (function walk(src, dest){
        for (const node of src.childNodes){
          if (node.nodeType === 3){
            for (const tok of node.nodeValue.split(/(\s+)/)){
              if (!tok) continue;
              const s = document.createElement('span');
              s.className = 'w'; s.textContent = tok; dest.appendChild(s);
            }
          } else {
            const el = document.createElement(node.tagName);
            dest.appendChild(el); walk(node, el);
          }
        }
      })(tmp, qt);
      return qt.querySelectorAll('.w');
    }

    function setQuote(i){
      clearTimeout(timer);
      qt.querySelectorAll('.w').forEach((w, j) => {
        w.classList.remove('in'); w.classList.add('out');
        w.style.transitionDelay = (j * 6) + 'ms';
      });
      qa.classList.remove('in');

      setTimeout(() => {
        idx = (i + sequence.length) % sequence.length;
        const q = sequence[idx];
        const n = plainLen(q.text);
        applySize(n);
        const long = n > 230;
        const ws = build(q.text);
        qa.innerHTML = q.attr.replace(/^—\s*/, '');
        const step = long ? 18 : 52;   // pairs of words, so it reads as phrases
        requestAnimationFrame(() => requestAnimationFrame(() => {
          ws.forEach((w, j) => {
            w.style.transitionDelay = (Math.floor(j / 2) * step) + 'ms';
            w.classList.add('in');
          });
          setTimeout(() => qa.classList.add('in'), Math.min(ws.length / 2 * step, 1000) + 300);
        }));
        timer = setTimeout(() => setQuote(idx + 1), durationFor(q) * 1000);
      }, reduce ? 0 : 560);
    }

    applySize(plainLen(first.text));   // size before first paint, no jump
    build(first.text);
    setQuote(0);
  </script>
</body>
</html>
