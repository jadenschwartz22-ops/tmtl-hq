<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="canonical" href="https://teachmetolive.com/contact.html" />
<title>Contact — Teach Me to Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;1,300;1,400&family=Archivo:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/pages.css">
</head>
<body>
<header>
  <div class="wrap header-inner">
    <a class="brand" href="index.html">Teach Me to Live</a>
    <nav>
      <a href="about.html">About</a>
      <a href="projects.html">Projects</a>
      <a href="contact.html" aria-current="page">Contact</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="pagehead reveal">
    <h1 class="statement">Contact</h1>
  </div>

  <!-- Underlined fields on the page ground, no surrounding card.
       Real labels rather than placeholder-only: placeholders vanish on focus
       and leave the user guessing what a field was for. -->
  <form class="form reveal" style="--d:.08s" id="contact"
        action="https://formspree.io/f/xeorropn" method="POST" novalidate>
    <div class="field">
      <label for="name">Name</label>
      <input id="name" type="text" name="name" required autocomplete="name" />
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" name="email" required autocomplete="email" />
    </div>
    <div class="field">
      <label for="message">Message</label>
      <textarea id="message" name="message" required></textarea>
    </div>

    <input type="hidden" name="_subject" value="TMTL Contact" />
    <input type="text" name="_honeypot" style="display:none" tabindex="-1" autocomplete="off" />

    <button class="send" type="submit" id="send">Send</button>
    <p class="note ok"  id="ok"  role="status" hidden>Thank you. We have it, and we will reply.</p>
    <p class="note bad" id="err" role="alert"  hidden>That did not send. Try again, or email us directly.</p>
  </form>

  <p class="aside reveal" style="--d:.14s">
    Prefer email? <a href="mailto:nathaniel@teachmetolive.com">nathaniel@teachmetolive.com</a>
  </p>
</main>

<div class="wrap">
  <div class="footline">
    <span><b>Tools for learning.</b> Makers of <a href="https://protoquiz.com">ProtoQuiz™</a>.</span>
    <small>© 2024&ndash;<span class="y"></span> Teach Me To Live LLC · <a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a></small>
  </div>
</div>

<script src="js/pages.js"></script>
<script>
const form=document.getElementById('contact'),
      ok=document.getElementById('ok'), err=document.getElementById('err'),
      send=document.getElementById('send');

form.addEventListener('submit', async e=>{
  e.preventDefault();
  ok.hidden = err.hidden = true;

  // Let the browser surface its own validation rather than failing silently.
  if(!form.reportValidity()) return;

  send.disabled = true; send.textContent = 'Sending';
  const res = await fetch(form.action,{
    method:'POST', body:new FormData(form), headers:{Accept:'application/json'}
  }).catch(()=>null);

  send.disabled = false; send.textContent = 'Send';
  if(res && res.ok){ form.reset(); ok.hidden = false; }
  else { err.hidden = false; }
});
</script>
</body>
</html>
